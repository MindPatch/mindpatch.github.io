<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MindPatch — Khaled Nassar</title>
<meta name="description" content="Khaled Nassar (MindPatch) — security engineering.">
<meta name="theme-color" content="#171613">
<meta property="og:title" content="MindPatch — Khaled Nassar">
<meta property="og:description" content="Khaled Nassar (MindPatch) — security engineering.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.mindpatch.net/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23C8432B'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23F4EEE1'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171613;
    --panel: #1C1B18;
    --ink: #ECE6D8;
    --body: #CFC8B8;
    --muted: #A39E90;
    --line: #33302A;
    --accent: #E4663F;
    --seal: #C8432B;
    --seal-ink: #F4EEE1;
    --serif: 'Shippori Mincho', 'Hiragino Mincho ProN', Georgia, serif;
    --sans: 'Zen Kaku Gothic New', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { color-scheme: dark; -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 2px; }

  .wrap {
    width: 100%;
    max-width: 848px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- Header ---------- */
  .site-header .inner {
    height: 104px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }

  .brand { display: flex; align-items: center; gap: 14px; padding: 8px 0; }
  .brand:hover { text-decoration: none; }
  .brand:hover .brand-name { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }

  .seal {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--seal);
    color: var(--seal-ink);
    font-family: var(--serif);
    font-weight: 700;
    line-height: 1;
    flex-shrink: 0;
  }
  .brand .seal { width: 38px; height: 38px; border-radius: 4px; font-size: 22px; }
  .brand-name { font-family: var(--serif); font-size: 18px; font-weight: 600; letter-spacing: 0.1em; }

  .nav { display: flex; align-items: center; gap: 32px; font-size: 14px; letter-spacing: 0.08em; }
  .nav a { padding: 12px 0; color: var(--muted); }
  .nav a:hover { color: var(--ink); }
  .nav .btn {
    display: flex;
    align-items: center;
    height: 44px;
    padding: 0 22px;
    border: 1px solid var(--ink);
    border-radius: 2px;
    color: var(--ink);
    font-weight: 500;
    transition: background-color .2s, color .2s;
  }
  .nav .btn:hover { background: var(--ink); color: var(--bg); text-decoration: none; }

  /* ---------- Hero ---------- */
  .hero .wrap {
    padding-top: 120px;
    padding-bottom: 112px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 48px;
  }
  .hero-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 44px; }

  .profile { display: flex; align-items: center; gap: 36px; }

  .avatar {
    position: relative;
    width: 128px;
    height: 128px;
    flex-shrink: 0;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
  }
  .avatar:hover { transform: scale(1.04); }
  .avatar:active { transform: scale(.96); }
  .avatar:focus-visible { outline-offset: 6px; border-radius: 50%; }
  .enso {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: var(--ink);
    stroke-linecap: round;
    transform-origin: 50% 50%;
    transition: transform .8s cubic-bezier(.22, 1, .36, 1);
  }
  .avatar:hover .enso { transform: rotate(28deg); }
  .emoji {
    position: relative;
    display: inline-block;
    font-family: var(--emoji);
    font-size: 54px;
    line-height: 1;
  }
  .avatar:hover .emoji { animation: wiggle .6s ease-in-out; }
  .emoji.pop { animation: pop .35s cubic-bezier(.34, 1.56, .64, 1); }

  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-14deg); }
    50% { transform: rotate(10deg); }
    75% { transform: rotate(-6deg); }
  }
  @keyframes pop {
    0% { transform: scale(.6); opacity: .4; }
    100% { transform: scale(1); opacity: 1; }
  }

  .identity { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow::before {
    content: "";
    width: 28px;
    height: 2px;
    background: var(--accent);
    flex-shrink: 0;
  }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(38px, 6vw, 60px);
    line-height: 1.05;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .role { font-size: 14px; letter-spacing: 0.12em; color: var(--muted); }

  .links {
    display: flex;
    flex-wrap: wrap;
    column-gap: 36px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 15px;
    letter-spacing: 0.04em;
  }
  .links a { display: flex; align-items: center; gap: 6px; padding: 12px 0; }
  .links svg { width: 13px; height: 13px; flex-shrink: 0; }

  .side-mark {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding-top: 4px;
  }
  .side-mark .word {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: var(--serif);
    font-size: 12px;
    letter-spacing: 0.35em;
    color: var(--muted);
  }
  .side-mark .rule { width: 1px; height: 72px; background: var(--line); }
  .side-mark .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  /* ---------- Contact ---------- */
  .contact {
    position: relative;
    margin-bottom: 96px;
    padding: 48px 52px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .contact h2 {
    margin: 0;
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .contact p { margin: 0; font-size: 16px; line-height: 1.7; letter-spacing: 0.02em; color: var(--body); }
  .contact .email {
    align-self: flex-start;
    margin-top: 8px;
    padding: 6px 0;
    font-family: var(--serif);
    font-size: clamp(24px, 4.6vw, 38px);
    font-weight: 500;
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 10px;
    text-decoration-thickness: 1px;
    overflow-wrap: anywhere;
  }
  .contact .email:hover { text-decoration-thickness: 2px; }
  .contact .seal {
    position: absolute;
    top: 44px;
    right: 48px;
    width: 64px;
    height: 64px;
    border-radius: 6px;
    font-size: 36px;
    transform: rotate(-6deg);
  }

  /* ---------- Footer ---------- */
  .site-footer { margin-top: auto; }
  .site-footer .inner {
    padding: 28px 0 48px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .site-footer small { font-size: 13px; letter-spacing: 0.08em; color: var(--muted); }
  .site-footer nav { display: flex; flex-wrap: wrap; column-gap: 28px; font-size: 14px; letter-spacing: 0.04em; color: var(--muted); }
  .site-footer nav a { padding: 12px 0; }
  .site-footer nav a:hover { color: var(--ink); }

  /* ---------- Small screens ---------- */
  @media (max-width: 640px) {
    .site-header .inner { height: 76px; }
    .brand { gap: 10px; }
    .brand .seal { width: 32px; height: 32px; font-size: 18px; }
    .brand-name { font-size: 16px; letter-spacing: 0.08em; }
    .nav { gap: 16px; font-size: 13px; letter-spacing: 0.06em; }
    .nav .btn { padding: 0 14px; }

    .hero .wrap { padding-top: 48px; padding-bottom: 56px; gap: 16px; }
    .hero-main { gap: 28px; }
    .profile { gap: 18px; }
    .avatar { width: 88px; height: 88px; }
    .emoji { font-size: 38px; }
    .identity { gap: 8px; }
    .eyebrow { font-size: 11px; letter-spacing: 0.25em; gap: 8px; }
    .eyebrow::before { width: 18px; }
    .role { font-size: 12px; letter-spacing: 0.08em; }
    .links { column-gap: 24px; padding-top: 6px; }
    .links svg { width: 12px; height: 12px; }

    .side-mark { gap: 12px; padding-top: 2px; }
    .side-mark .word { font-size: 10px; letter-spacing: 0.3em; }
    .side-mark .rule { height: 48px; }
    .side-mark .dot { width: 6px; height: 6px; }

    .contact { margin-bottom: 56px; padding: 28px 24px; gap: 12px; }
    .contact h2 { font-size: 30px; }
    .contact p { font-size: 15px; }
    .contact .email { text-underline-offset: 7px; }
    .contact .seal { top: 22px; right: 20px; width: 44px; height: 44px; border-radius: 5px; font-size: 25px; }

    .site-footer .inner { flex-direction: column-reverse; align-items: flex-start; gap: 4px; padding: 20px 0 40px; }
    .site-footer small { font-size: 12px; }
    .site-footer nav { column-gap: 20px; }
  }

  @media (max-width: 360px) {
    .profile { flex-direction: column; align-items: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    .avatar, .enso, .nav .btn { transition: none; }
    .avatar:hover, .avatar:hover .enso { transform: none; }
    .avatar:hover .emoji, .emoji.pop { animation: none; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="inner">
      <a class="brand" href="#top" aria-label="MindPatch — home">
        <span class="seal" aria-hidden="true">M</span>
        <span class="brand-name">MindPatch</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#top">About</a>
        <a class="btn" href="#contact">Contact</a>
      </nav>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero" aria-labelledby="name">
    <div class="wrap">
      <div class="hero-main">
        <div class="profile">
          <button type="button" class="avatar" id="avatar" aria-label="Change avatar emoji" title="Click me">
            <svg class="enso" viewBox="0 0 128 128" aria-hidden="true">
              <circle cx="64" cy="64" r="57" stroke-width="5" stroke-dasharray="318 60" transform="rotate(-70 64 64)" opacity="0.9"/>
              <circle cx="64" cy="64" r="53.5" stroke-width="1.5" stroke-dasharray="270 110" transform="rotate(-55 64 64)" opacity="0.45"/>
            </svg>
            <span class="emoji" id="emoji">🧑‍💻</span>
          </button>
          <div class="identity">
            <span class="eyebrow">About</span>
            <h1 id="name">Khaled Nassar</h1>
            <span class="role">Security engineering</span>
          </div>
        </div>

        <nav class="links" aria-label="Profiles">
          <a href="https://github.com/MindPatch" rel="noopener" target="_blank">GitHub<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></a>
          <a href="https://mindpatch.medium.com/" rel="noopener" target="_blank">Medium<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></a>
          <a href="https://twitter.com/mindpatchsec" rel="noopener" target="_blank">Twitter<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></a>
          <a href="https://www.linkedin.com/in/knassar702/" rel="noopener" target="_blank">LinkedIn<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg></a>
        </nav>
      </div>

      <div class="side-mark" aria-hidden="true">
        <span class="word">MINDPATCH</span>
        <span class="rule"></span>
        <span class="dot"></span>
      </div>
    </div>
  </section>

  <div class="wrap">
    <section class="contact" id="contact" aria-labelledby="contact-title">
      <span class="eyebrow">Contact</span>
      <h2 id="contact-title">Say hello</h2>
      <p>Email is the best way to reach me.</p>
      <a class="email" href="mailto:hello@mindpatch.net">hello@mindpatch.net</a>
      <span class="seal" aria-hidden="true">M</span>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="inner">
      <small>© 2026 Khaled Nassar</small>
      <nav aria-label="Social">
        <a href="https://github.com/MindPatch" rel="noopener" target="_blank">GitHub</a>
        <a href="https://mindpatch.medium.com/" rel="noopener" target="_blank">Medium</a>
        <a href="https://twitter.com/mindpatchsec" rel="noopener" target="_blank">Twitter</a>
        <a href="https://www.linkedin.com/in/knassar702/" rel="noopener" target="_blank">LinkedIn</a>
      </nav>
    </div>
  </div>
</footer>

<script>
  (function () {
    var faces = ['🧑‍💻', '👋', '🐛', '🔐', '☕'];
    var i = 0;
    var avatar = document.getElementById('avatar');
    var emoji = document.getElementById('emoji');
    avatar.addEventListener('click', function () {
      i = (i + 1) % faces.length;
      emoji.textContent = faces[i];
      emoji.classList.remove('pop');
      void emoji.offsetWidth;
      emoji.classList.add('pop');
    });
  })();
</script>
</body>
</html>
